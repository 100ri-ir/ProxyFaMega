<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>ProxyFaMega</title>
  <link rel="stylesheet" href="../common/ui.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="bg-blobs"><i></i><i></i><i></i></div>

  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <img src="../assets/icons/icon128.png" alt="ProxyFaMega">
        <div class="brand-name">Proxy<span class="grad-text">FaMega</span><span class="brand-ver" id="brandVer"></span></div>
      </div>
      <nav id="nav"></nav>
      <div class="side-foot">
        <div class="seg lang-seg" id="langSeg">
          <button data-lang="fa">فارسی</button>
          <button data-lang="en">English</button>
        </div>
        <button class="btn-icon" id="appearanceBtn" title=""></button>
      </div>
    </aside>

    <main id="main">
      <header id="topbar">
        <h1 id="viewTitle"></h1>
        <div class="save-dot" id="saveDot"><span class="badge-dot"></span><span id="saveText"></span></div>
      </header>
      <div id="viewRoot" class="view-root"></div>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <script src="../common/boot.js"></script>
  <script src="../common/constants.js"></script>
  <script src="../common/i18n.js"></script>
  <script src="../common/defaults.js"></script>
  <script src="../common/matcher.js"></script>
  <script src="../common/storage.js"></script>
  <script src="../common/theme.js"></script>
  <script src="ui.js"></script>
  <script src="views/dashboard.js"></script>
  <script src="views/profiles.js"></script>
  <script src="views/auto.js"></script>
  <script src="views/settings.js"></script>
  <script src="views/backup.js"></script>
  <script src="views/about.js"></script>
  <script src="app.js"></script>
</body>
</html>
