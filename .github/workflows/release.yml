name: Release Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run logic tests
        run: node test/logic_test.js

      - name: Build packages
        run: python3 scripts/build.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proxyfamega-packages
          path: dist/*.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
            echo "::notice::Updated assets on existing release $TAG"
          else
            gh release create "$TAG" dist/*.zip --title "ProxyFaMega $TAG" --generate-notes
            echo "::notice::Created release $TAG"
          fi
