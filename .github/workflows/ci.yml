name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: |
          node test/logic_test.js
          node test/background_smoke_test.js

      - name: i18n consistency check
        run: python3 scripts/check_i18n.py

      - name: Build package (smoke)
        run: python3 scripts/build.py
